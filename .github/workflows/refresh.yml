name: Refresh Fairway Board

on:
  schedule:
    # This is a SAFETY NET ONLY, not the primary mechanism -- GitHub's cron
    # trigger is documented as best-effort and observed in practice to skip
    # or delay high-frequency (*/5) schedules by 20-60+ minutes on repos
    # without heavy traffic. Real continuity comes from the "Trigger next
    # run" step below, which has each run kick off its own successor via
    # the API the moment it finishes, instead of waiting on GitHub's
    # scheduler. This cron just restarts the chain if it ever dies.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send one fake test alert to Telegram instead of running a real scan (does not touch simulator.db)"
        type: boolean
        default: false
      resend_since_utc:
        description: "Catch-up: resend a real Telegram alert for every bet placed at/after this UTC timestamp (e.g. 2026-08-11T19:49:47), for recovering after a Telegram outage. Leave blank to skip. Does not touch simulator.db."
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  # One-off dispatches (test alert, catch-up resend) get their own lane so
  # they don't get evicted from the queue by the continuously self-chaining
  # main loop before they can ever start.
  group: ${{ (github.event.inputs.test_telegram == 'true' || github.event.inputs.resend_since_utc != '') && 'refresh-fairway-board-test' || 'refresh-fairway-board' }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: scanner
        run: pip install -r requirements.txt

      - name: Send Telegram test alert (test_telegram=true only, does not touch simulator.db)
        if: ${{ github.event.inputs.test_telegram == 'true' }}
        working-directory: scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import telegram_alert, simulator_db
          names = ['Zed, Player', 'Adams, Player', 'Mid, Player', 'Bee, Player', 'Young, Player',
                   'Craft, Player']
          fake = [simulator_db.SimBet(
              event_name='TEST ALERT -- not a real pick', tour='pga', market='WIN',
              player_name=n, opponents=[], round_num=None,
              book_decimal=51.0, book_american='+5000', model_prob=0.03,
              fair_decimal=33.3, ev_percent=42.0, stake=5.00,
          ) for n in names]
          telegram_alert.send_new_bets(fake)
          print('Sent (or no-op if TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID are unset). 6 fake bets should arrive as 2 messages (5 + 1), alphabetically ordered.')
          "

      - name: Resend Telegram alert for bets since a given time (catch-up after an outage)
        if: ${{ github.event.inputs.resend_since_utc != '' }}
        working-directory: scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "
          import json
          import simulator_db, telegram_alert
          since = '${{ github.event.inputs.resend_since_utc }}'
          with simulator_db.connect() as conn:
              rows = conn.execute('SELECT * FROM bets WHERE placed_at >= ? ORDER BY placed_at', (since,)).fetchall()
          bets = [simulator_db.SimBet(
              event_name=r['event_name'], tour=r['tour'], market=r['market'],
              player_name=r['player_name'], opponents=json.loads(r['opponents']),
              round_num=r['round_num'], book_decimal=r['book_decimal'],
              book_american=r['book_american'], model_prob=r['model_prob'],
              fair_decimal=r['fair_decimal'], ev_percent=r['ev_percent'], stake=r['stake'],
          ) for r in rows]
          print(f'Resending {len(bets)} bet(s) placed since {since}...')
          telegram_alert.send_new_bets(bets)
          "

      - name: Continuous refresh loop (split-cadence ticks, rebuild, push -- repeats for ~4.5 min)
        # Split cadence: outrights/top5/10/20 refresh ~every 30s, matchups
        # and mc/frl (+ grading, which needs its own extra requests)
        # refresh ~every 150s -- see cadence.py for exactly why (the naive
        # "outrights every 10s" ask is 105 req/min, more than double
        # DataGolf's 45/min cap). --tick does whatever's due and is a cheap
        # no-op otherwise, so this polls it every few seconds rather than
        # re-running a full scan each iteration like before.
        if: ${{ github.event.inputs.test_telegram != 'true' && github.event.inputs.resend_since_utc == '' }}
        working-directory: scanner
        env:
          DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
          TOURS: pga,euro,kft,alt
          OUTRIGHT_MARKETS: win,top_5,top_10,top_20,mc,frl
          MATCHUP_MARKETS: tournament_matchups,round_matchups,3_balls
          INCLUDE_MATCHUPS: "true"
          MIN_EV_PERCENT: "3.0"
          BANKROLL: "2000"
          KELLY_FRACTION: "0.25"
          MAX_STAKE: "50"
          REQUESTS_PER_MINUTE: "42"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          end=$((SECONDS + 260))
          i=0
          while [ "$SECONDS" -lt "$end" ]; do
            i=$((i + 1))
            echo "::group::Tick $i (t=${SECONDS}s)"
            python app.py --tick --min-ev 3
            python build_artifact.py ../index.html --live
            git add ../index.html simulator.db
            if git diff --cached --quiet; then
              echo "No changes."
            else
              git commit -m "Automated refresh: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
              git push
            fi
            echo "::endgroup::"
            sleep 2
          done
          echo "Ran $i tick(s) in ${SECONDS}s."

      - name: Trigger next run
        # Runs even if the loop above hit an error, so a transient DataGolf
        # or git failure doesn't kill the chain -- and skipped for test runs,
        # so firing a test alert doesn't spin up a real scan chain.
        if: always() && github.event.inputs.test_telegram != 'true' && github.event.inputs.resend_since_utc == ''
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/refresh.yml/dispatches" \
            -d '{"ref":"main"}' \
          && echo "Next run dispatched." \
          || echo "::warning::Failed to dispatch next run -- the */5 cron will pick it back up within a few minutes."
