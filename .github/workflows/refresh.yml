name: Refresh Fairway Board

on:
  schedule:
    # GitHub's minimum supported *trigger* interval for scheduled workflows
    # is 5 minutes -- there's no way to cron more often than this. To get
    # close to a 1-minute board refresh anyway, each run loops internally
    # (see "Continuous refresh loop" below), doing back-to-back scans for
    # ~4.5 minutes before exiting, so the next 5-minute cron pickup lands
    # right as this one finishes. A full DataGolf scan (~33 paced requests)
    # already takes 45-60s on its own -- see scanner/README -- so back-to-back
    # scans naturally land close to once a minute without adding artificial
    # delay, while REQUESTS_PER_MINUTE below keeps every run under DataGolf's
    # 45 req/min limit.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-fairway-board
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: scanner
        run: pip install -r requirements.txt

      - name: Continuous refresh loop (scan, log paper bets, rebuild, push -- repeats for ~4.5 min)
        working-directory: scanner
        env:
          DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
          TOURS: pga,euro,kft,alt
          OUTRIGHT_MARKETS: win,top_5,top_10,top_20,mc,frl
          MATCHUP_MARKETS: tournament_matchups,round_matchups,3_balls
          INCLUDE_MATCHUPS: "true"
          MIN_EV_PERCENT: "3.0"
          BANKROLL: "2000"
          KELLY_FRACTION: "0.25"
          MAX_STAKE: "50"
          REQUESTS_PER_MINUTE: "40"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          end=$((SECONDS + 260))
          i=0
          while [ "$SECONDS" -lt "$end" ]; do
            i=$((i + 1))
            echo "::group::Cycle $i (t=${SECONDS}s)"
            python app.py --min-ev 3
            python build_artifact.py ../index.html --live
            git add ../index.html simulator.db
            if git diff --cached --quiet; then
              echo "No changes."
            else
              git commit -m "Automated refresh: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
              git push
            fi
            echo "::endgroup::"
          done
          echo "Ran $i cycle(s) in ${SECONDS}s."
